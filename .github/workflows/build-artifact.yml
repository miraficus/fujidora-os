name: Build Fujidora F44 Artifact

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    container:
      image: fedora:44
      options: --privileged

    steps:
      - name: Stáhnutí zdrojového kódu z GitHubu
        uses: actions/checkout@v4

      - name: Instalace KIWI buildovacích nástrojů
        run: |
          dnf install -y kiwi python3-kiwi git dnf-plugins-core \
            e2fsprogs btrfs-progs dosfstools xfsprogs \
            squashfs-tools xorriso genisoimage
          
          dnf clean all

      - name: Validace konfigurace KIWI
        run: kiwi-ng --debug image info --description ./ --print-xml

      - name: Sestavení ISO obrazu (KIWI-ng)
        run: |
          mkdir -p /tmp/fujidora_output
          kiwi-ng --debug --logfile /tmp/fujidora-build.log system build --description ./ --target-dir /tmp/fujidora_output

      - name: Uložení diagnostického logu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fujidora-Build-Log
          path: /tmp/fujidora-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Uložení ISO jako GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fujidora-Live-ISO
          path: /tmp/fujidora_output/*.iso
          retention-days: 30
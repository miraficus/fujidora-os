name: Build Fujidora F44 ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    container:
      image: fedora:44
      options: --privileged

    steps:
      - name: Stáhnutí zdrojového kódu z GitHubu
        uses: actions/checkout@v4

      - name: Instalace KIWI buildovacích nástrojů
        run: |
          dnf install -y kiwi dnf-plugins-core git
          dnf clean all

      - name: Sestavení ISO obrazu (KIWI-ng)
        run: |
          mkdir -p /tmp/fujidora_output
          kiwi-ng system build --description ./ --target-dir /tmp/fujidora_output

      - name: Publikace ISO do GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Fujidora Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: /tmp/fujidora_output/*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
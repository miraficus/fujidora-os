name: Build Fujidora F44 ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    container:
      image: fedora:44
      options: --privileged

    steps:
      - name: Stáhnutí zdrojového kódu z GitHubu
        uses: actions/checkout@v4

      - name: Instalace KIWI buildovacích nástrojů
        run: |
          dnf install -y kiwi python3-kiwi git dnf-plugins-core \
            e2fsprogs btrfs-progs dosfstools xfsprogs \
            squashfs-tools xorriso genisoimage
          
          dnf clean all

      - name: Kontrola lokálních součástí motivu Monochrome
        run: bash scripts/check-theme.sh

      - name: Validace konfigurace KIWI
        run: kiwi-ng --debug image info --description ./ --print-xml

      - name: Sestavení ISO obrazu (KIWI-ng)
        run: |
          mkdir -p /tmp/fujidora_output
          kiwi-ng --debug --logfile /tmp/fujidora-build.log system build --description ./ --target-dir /tmp/fujidora_output

      - name: Ochranná výplň konce ISO a kontrolní součet
        run: python3 scripts/pad-iso.py /tmp/fujidora_output/*.iso

      - name: Uložení diagnostického logu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fujidora-Build-Log
          path: /tmp/fujidora-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publikace ISO do GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Fujidora Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            /tmp/fujidora_output/*.iso
            /tmp/fujidora_output/*.iso.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

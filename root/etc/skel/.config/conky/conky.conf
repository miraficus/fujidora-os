conky.config = {
    -- Nativní Wayland výstup pro KDE Plasma.
    out_to_wayland = true,
    out_to_x = false,

    -- --- Umístění a okno ---
    alignment = 'top_left',
    gap_x = 30,
    gap_y = 30,
    minimum_width = 260,
    minimum_height = 120,
    
    -- Méně časté překreslování (10s bohatě stačí pro hodiny, minuty a počasí)
    update_interval = 60.0,
    
    -- --- Zaoblení a integrace s KDE Plasma ---
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 0, 
    own_window_colour = '1e1e20', -- Tmavě šedá z vašeho Kitty tématu
    

    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    
    -- --- Grafika a Fonty ---
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    use_xft = true,
    font = 'JetBrains Mono:size=10',
    xftalpha = 1,
    
    -- --- Barevná paleta (Sladěno s Kitty) ---
    default_color = 'd8dee9',  -- Off-white text
    color1 = '81a1c1',         -- Ocelově modrá pro popisky
    color2 = 'a3be8c',         -- Šalvějově zelená pro hodnoty a počasí
    color3 = '4c566a',         -- Šedá pro oddělovače
};

conky.text = [[
${font JetBrains Mono:size=32}${alignc}${time %H:%M}${font}
${font JetBrains Mono:size=10}${alignc}${color1}${time %A, %d. %B %Y}${color}${font}
${alignc}${color2}${font JetBrains Mono:size=10}${execi 600 curl --silent --show-error --max-time 5 "https://wttr.in/Brno?format=%l:+%t"}${font}${color}
${color3}${hr 2}${color}
${alignc}${color1}Uptime:${color} ${alignc}${uptime_short}
]];

# --- Písmo ---
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Vzhled okna ---
window_padding_width 8
confirm_os_window_close 0

# --- Tmavě šedé pozadí a pastelové barvy ---
# Velmi tmavá šedá (místo úplné černé #000000)
background       #141617
foreground       #d8dee9
cursor           #d8dee9
cursor_text_color #141617

# Výběr textu (Selection)
selection_background #2e3440
selection_foreground #d8dee9

# --- ANSI paleta barev (Jemné, málo saturované pastelové odstíny) ---

# Black (Pozadí / tmavé tóny)
color0  #1c1f20
color8  #4c566a

# Red (Tlumená cihlová / pastelová červená)
color1  #bf616a
color9  #d08770

# Green (Jemná šalvějová / pastelová zelená)
color2  #a3be8c
color10 #b48ead

# Yellow (Ztlumená okrová / pastelová žlutá)
color3  #ebcb8b
color11 #eecf93

# Blue (Břidlicová / ocelově modrá)
color4  #81a1c1
color12 #88c0d0

# Magenta (Zastřená fialová / starorůžová)
color5  #b48ead
color13 #b576aa

# Cyan (Matná tyrkysová / eukalyptová)
color6  #8fbcbb
color14 #a3be8c

# White (Off-white / jemná světle šedá)
color7  #e5e9f0
color15 #eceff4
